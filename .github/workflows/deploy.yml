name: Build and Deploy Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:


env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: automata-group/lammah_backend
  UPLOADER_IMAGE: automata-group/lammah_uploader
  YTDL_IMAGE: automata-group/lammah_ytdl_service

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push YTDL Service image
        uses: docker/build-push-action@v5
        with:
          context: ./ytdl-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.YTDL_IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_SERVER }}
          script: |
            # Cleanup
            docker system prune -f
            
            mkdir -p ~/lammah_backend
            cd ~/lammah_backend

            # Write YouTube cookies from secret (bypasses VPS IP block completely)
            if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
              printf '%s' "${{ secrets.YOUTUBE_COOKIES }}" > youtube_cookies.txt
              chmod 600 youtube_cookies.txt
              echo "YouTube cookies file written successfully."
            else
              echo "WARNING: YOUTUBE_COOKIES secret not set. YouTube downloads may fail on this server IP."
            fi

            # Write docker-compose.yml
            cat > docker-compose.yml << 'COMPOSE_EOF'
            services:
              warp:
                image: caomingjun/warp:latest
                restart: unless-stopped
                cap_add:
                  - NET_ADMIN
                  - MKNOD
                sysctls:
                  - net.ipv6.conf.all.disable_ipv6=0
                  - net.ipv4.conf.all.src_valid_mark=1
                devices:
                  - /dev/net/tun:/dev/net/tun
                device_cgroup_rules:
                  - 'c 10:200 rwm'
                environment:
                  - WARP_SLEEP=5
                volumes:
                  - warp_data:/var/lib/cloudflare-warp
                healthcheck:
                  test: ["CMD", "curl", "-sf", "--proxy", "socks5://127.0.0.1:1080", "https://cloudflare.com/cdn-cgi/trace"]
                  interval: 30s
                  timeout: 20s
                  retries: 5
                  start_period: 30s

              ytdl-service:
                image: ghcr.io/automata-group/lammah_ytdl_service:latest
                restart: unless-stopped
                ports:
                  - "8001:8001"
                volumes:
                  - shared_uploads:/app/uploads
                  - ./youtube_cookies.txt:/app/youtube_cookies.txt
                environment:
                  - PORT=8001
                  - UPLOAD_DIR=/app/uploads
                  - YOUTUBE_PROXY=socks5://warp:1080
                  - YOUTUBE_COOKIES_PATH=/app/youtube_cookies.txt
                depends_on:
                  - warp
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 10s

              backend:
                image: ghcr.io/automata-group/lammah_backend:latest
                restart: unless-stopped
                ports:
                  - "8000:8000"
                volumes:
                  - ./outputs:/app/outputs
                  - shared_uploads:/app/uploads
                  - ./youtube_cookies.txt:/app/youtube_cookies.txt
                environment:
                  - SUPABASE_URL=$SUPABASE_URL
                  - SUPABASE_KEY=$SUPABASE_KEY
                  - SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY
                  - SECRET_KEY=$SECRET_KEY
                  - GEMINI_API_KEY=$GEMINI_API_KEY
                  - GROQ_API_KEY=$GROQ_API_KEY
                  - OPENROUTER_API_KEY=$OPENROUTER_API_KEY
                  - WHISPER_API_KEY=$WHISPER_API_KEY
                  - TEMP_DIR=/app/uploads/temp
                  - UPLOAD_DIR=/app/uploads
                  - YOUTUBE_DOWNLOADER_URL=http://ytdl-service:8001
                  - YOUTUBE_COOKIES_PATH=/app/youtube_cookies.txt
                depends_on:
                  ytdl-service:
                    condition: service_healthy
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3

              uploader:
                image: ghcr.io/automata-group/lammah_uploader:latest
                restart: unless-stopped
                ports:
                  - "8080:8080"
                volumes:
                  - shared_uploads:/app/uploads
                environment:
                  - SUPABASE_URL=$SUPABASE_URL
                  - SUPABASE_KEY=$SUPABASE_KEY
                  - TEMP_DIR=/app/uploads/temp
                healthcheck:
                  test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3

            volumes:
              shared_uploads:
              warp_data:
            COMPOSE_EOF

            # Write .env
            cat > .env << ENV_EOF
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            WHISPER_API_KEY=${{ secrets.WHISPER_API_KEY }}
            ENV_EOF

            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "Pulling latest images with retries..."
            MAX_PULL_RETRIES=5
            PULL_COUNT=0
            until docker compose pull; do
              PULL_COUNT=$((PULL_COUNT+1))
              if [ $PULL_COUNT -eq $MAX_PULL_RETRIES ]; then
                echo "Failed to pull images after $MAX_PULL_RETRIES attempts. Exiting."
                exit 1
              fi
              echo "Pull failed, retrying in 15 seconds ($PULL_COUNT/$MAX_PULL_RETRIES)..."
              sleep 15
            done

            docker compose up -d --force-recreate
            
            echo "Waiting 10 seconds for containers to initialize..."
            sleep 10
            
            echo "Deployment successful!"
            
            echo "=== Docker Container Status ==="
            docker ps -a
            echo "=== Backend Container Logs ==="
            docker compose logs --tail=100 backend
            echo "=== Uploader Container Logs ==="
            docker compose logs --tail=100 uploader

