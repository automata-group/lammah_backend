name: Build and Deploy Backend

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: automata-group/lammah_backend
  UPLOADER_IMAGE: automata-group/lammah_uploader

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push Uploader image
        uses: docker/build-push-action@v5
        with:
          context: ./uploader-go
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.UPLOADER_IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_SERVER }}
          script: |
            # Cleanup
            docker system prune -f
            
            mkdir -p ~/lammah_backend
            cd ~/lammah_backend

            # Write docker-compose.yml
            cat > docker-compose.yml << 'COMPOSE_EOF'
            services:
              backend:
                image: ghcr.io/automata-group/lammah_backend:latest
                restart: unless-stopped
                ports:
                  - "8000:8000"
                volumes:
                  - ./outputs:/app/outputs
                  - shared_uploads:/app/uploads
                environment:
                  - SUPABASE_URL=$SUPABASE_URL
                  - SUPABASE_KEY=$SUPABASE_KEY
                  - SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY
                  - SECRET_KEY=$SECRET_KEY
                  - GEMINI_API_KEY=$GEMINI_API_KEY
                  - GROQ_API_KEY=$GROQ_API_KEY
                  - OPENROUTER_API_KEY=$OPENROUTER_API_KEY
                  - WHISPER_API_KEY=$WHISPER_API_KEY
                  - TEMP_DIR=/app/uploads/temp
                  - UPLOAD_DIR=/app/uploads
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3

              uploader:
                image: ghcr.io/automata-group/lammah_uploader:latest
                restart: unless-stopped
                ports:
                  - "8080:8080"
                volumes:
                  - shared_uploads:/app/uploads
                environment:
                  - SUPABASE_URL=$SUPABASE_URL
                  - SUPABASE_KEY=$SUPABASE_KEY
                  - TEMP_DIR=/app/uploads/temp
                healthcheck:
                  test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3

            volumes:
              shared_uploads:
            COMPOSE_EOF

            # Write .env
            cat > .env << ENV_EOF
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            WHISPER_API_KEY=${{ secrets.WHISPER_API_KEY }}
            ENV_EOF

            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "Pulling latest images with retries..."
            MAX_PULL_RETRIES=5
            PULL_COUNT=0
            until docker compose pull; do
              PULL_COUNT=$((PULL_COUNT+1))
              if [ $PULL_COUNT -eq $MAX_PULL_RETRIES ]; then
                echo "Failed to pull images after $MAX_PULL_RETRIES attempts. Exiting."
                exit 1
              fi
              echo "Pull failed, retrying in 15 seconds ($PULL_COUNT/$MAX_PULL_RETRIES)..."
              sleep 15
            done

            docker compose up -d --force-recreate
            
            echo "Deployment successful!"
