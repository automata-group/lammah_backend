name: Build and Deploy Backend

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: automata-group/lammah_backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_SERVER }}
          script: |
            # Create project directory if not exists
            mkdir -p ~/lammah_backend
            cd ~/lammah_backend
            
            # Create a simple docker-compose if not present
            # Note: In a real scenario, you might want to SCP the docker-compose.yml
            cat <<EOF > docker-compose.yml
            services:
              backend:
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                restart: unless-stopped
                ports:
                  - "8000:8000"
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
            EOF
            
            # Pull and restart
            echo ${{ secrets.GHCR_PAT }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d

      - name: Evaluate Health
        run: |
          echo "Waiting for service to be healthy..."
          MAX_RETRIES=12
          COUNT=0
          # We check the health via the server IP directly or via the domain if DNS is set
          until $(curl --output /dev/null --silent --head --fail http://${{ secrets.SERVER_IP }}:8000/api/v1/health); do
            if [ $COUNT -eq $MAX_RETRIES ]; then
              echo "Timeout: Service is not healthy!"
              exit 1
            fi
            echo "Retrying health check ($COUNT/$MAX_RETRIES)..."
            sleep 10
            COUNT=$((COUNT+1))
          done
          echo "Service is healthy and live!"
