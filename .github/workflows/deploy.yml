name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        # This is a placeholder. Usually you'd push to Docker Hub or GHCR.
        # For now we just build to verify.
        run: |
          docker build -t backend:latest ./backend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        run: |
          echo "Connecting to server and deploying..."
          # Example SSH deployment command:
          # ssh user@server "cd mydoc && docker-compose pull && docker-compose up -d"
      
      - name: Evaluate Health
        run: |
          echo "Waiting for service to be healthy..."
          # Simple wait and evaluate logic
          MAX_RETRIES=10
          COUNT=0
          until $(curl --output /dev/null --silent --head --fail http://your-server-ip/api/v1/health); do
            if [ $COUNT -eq $MAX_RETRIES ]; then
              echo "Timeout: Service is not healthy!"
              exit 1
            fi
            echo "Retrying health check ($COUNT/$MAX_RETRIES)..."
            sleep 10
            COUNT=$((COUNT+1))
          done
          echo "Service is healthy and live!"
